version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cloudflare-toolchain:
        patterns:
          - cf
          - '@cloudflare/*'
          - miniflare
          - workerd
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
